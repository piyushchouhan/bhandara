site_name: Local Feast
site_description: Product, investor, and technical documentation for Local Feast, developed in the Bhandara repository.
site_url: https://piyushchouhan.github.io/bhandara/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Product:
      - Overview: index.md
      - Investor Brief: investor-brief.md
      - Feature Catalogue: features.md
      - Roadmap and Readiness: roadmap.md
  - Technology:
      - Architecture: architecture.md
      - Backend Integration: backend-integration.md
      - API Reference: api-reference.md
      - Firebase and Platform Services: firebase-setup.md
  - Development:
      - Getting Started: getting-started.md
      - Development Guide: development.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
