site_name: Local Feast
site_description: Developer documentation for the Local Feast mobile applications and backend.
site_url: https://piyushchouhan.github.io/bhandara/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Project:
      - Overview: index.md
      - Feature Catalogue: features.md
      - Implementation Gaps: roadmap.md
  - Technology:
      - Architecture: architecture.md
      - Backend Integration: backend-integration.md
      - Mobile API Reference: api-reference.md
      - Firebase and Platform Services: firebase-setup.md
  - Backend:
      - Overview: backend/index.md
      - Architecture and Flows: backend/architecture.md
      - Data Model: backend/data-model.md
      - API Reference: backend/api-reference.md
      - Authentication and Moderation: backend/security.md
      - Setup and Operations: backend/operations.md
      - Development and Testing: backend/testing.md
  - Development:
      - Getting Started: getting-started.md
      - Development Guide: development.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
